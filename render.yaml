services:
  - type: web
    name: cisco-ccw-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: CISCO_CLIENT_ID
        sync: false
      - key: CISCO_CLIENT_SECRET
        sync: false
      - key: CISCO_TOKEN_URL
        value: https://id.cisco.com/oauth2/default/v1/token
      - key: CCW_GRAPHQL_URL
        value: https://capi.cisco.com/commerce/apis
      - key: CCW_DEFAULT_PRICE_LIST
        value: GLBRL
      - key: CCW_DRY_RUN
        value: "true"
      - key: MCP_ACCESS_TOKEN
        sync: false
    healthCheckPath: /healthz
